# CI: CPU-side gates on every PR. GPU stages run Colab-side; a PR that
# does not plan clean on CPU does not merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: uv.lock

      - name: Install (CPU-only runtime + dev)
        run: uv sync --frozen --extra dev

      - name: Lint (src + conftest)
        run: uv run --no-sync ruff check src/ conftest.py

      - name: Pytest (packaging contract, Run-001 parity contract)
        run: uv run --no-sync pytest tests/ -q

      - name: Shipped specs validate + plan clean on CPU
        run: |
          fail=0
          for f in specs/*.yaml; do
            echo "== $f =="
            uv run --no-sync abliterate --spec "$f" validate || fail=1
            uv run --no-sync abliterate plan --spec "$f" > /dev/null || fail=1
          done
          [ "$fail" -eq 0 ] || exit 1

  # The default job has no torch, so the GPU-side engine (load, capture,
  # edits, save/reload/verify, ARA, publish card) never ran in CI — two
  # regressions reached main that way. This job installs CPU torch and runs
  # the real engine end to end on tiny random models (tied + untied).
  cpu-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: uv.lock

      - name: Install (dev + CPU torch + transformers)
        run: |
          uv sync --frozen --extra dev
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install "transformers>=4.44" accelerate

      - name: End-to-end engine run on tiny CPU models
        run: uv run --no-sync pytest tests/test_e2e_cpu.py -v
