spec_version: 1
run_card:
  run_number: 10
  patient: qwen2.5-coder-7b
  purpose: "first coding-model patient (user directive 2026-10-05): chat-vs-coder
    geometry comparison on the identical engine; code-specific probe pools +
    extended code-refusal markers; HumanEval as a DIAGNOSTIC (never the publish
    gate); MMLU stays THE capability guardrail (program comparability)"

patient:
  model_id: Qwen/Qwen2.5-Coder-7B-Instruct
  revision: c03e6d358207e414f1eca0bb1891e29f1db0e242
  structure_expect:
    num_hidden_layers: 28
    num_attention_heads: 28
    num_key_value_heads: 4
    tie_word_embeddings: false
    o_proj_shape: [3584, 3584]
    down_proj_shape: [3584, 18944]

probe_sets:
  # stage A capture + selection stay on the primary64 pools (cross-run anchor,
  # all 8 prior runs measured on these); n_pairs=64 indexes the full pool
  harmful: builtin:primary64_harmful
  harmless: builtin:primary64_harmless
  n_pairs: 64
  n_probes: 16
  refusal_markers: builtin:fp_explicit_v1
  # run-010 diagnostic extension (v1 amendment): code-specific probe pools +
  # extended code-refusal markers for the DIAGNOSTIC lane; runtime probe
  # config + gates/publish contract are untouched (v1 grader/16 probes/gates)
  diagnostic_pools:
    harmful: builtin:code_harm64
    benign: builtin:code_benign64
    n_probes: 64
    refusal_markers: builtin:code_fp_v1

decoding:
  max_new_tokens: 200
  strategy: greedy
  seed: 0

ladder:
  variants: [wd_B, wd_BN, wd_ML, wd_ML_BN]
  k_primary: 3
  k_combo: 5

gates:
  benign_floor_delta: 0.10
  degenerate_max: 0
  publish_refusal: 0.25
  mmlu_max_loss_pp: 3.0

publish:
  repo_id: sbussiso/Qwen2.5-Coder-7B-abliterated
  license: apache-2.0
  card_marker: "abliterated by the sbussiso lab research agent"
  verify_disk_bounds:
    lm_head: 0.005
    final_norm: 0.05
    layer_row: 0.01
  private: true

colab:
  gpu: l4          # 7B fp16 capture needs > T4-16GB headroom with device_map=auto
  max_runtime_minutes: 240

hitl:
  after_selection: true
  before_publish: true