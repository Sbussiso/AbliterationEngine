[project]
name = "abliteration-engine"
version = "0.1.0"
description = "Config-driven abliteration harness: one parameterized engine + YAML run specs (eng v3)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "sbussiso" }]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2",
    "transformers>=4.44",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
abliterate = "abliteration_engine.cli:main"

[build-system]
requires = ["uv_build>=0.7,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "abliteration_engine"

[tool.pytest.ini_options]
testpaths = ["tests", "harness_v3"]

[tool.ruff]
line-length = 88
target-version = "py311"