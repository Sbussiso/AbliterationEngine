[project]
name = "abliteration-engine"
version = "0.3.0"
description = "Config-driven abliteration harness: one parameterized engine + YAML run specs (eng v3)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "sbussiso" }]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2",
    "transformers>=4.44",
]
charts = [
    # model-card figures (publish renders them when importable)
    "matplotlib>=3.7",
]
dev = [
    "pytest>=8.0",
    # CI renders the card charts for real (tests/test_card_charts.py)
    "matplotlib>=3.7",
    "ruff>=0.6",
    # publish tests mock huggingface_hub.HfApi; CI's frozen sync has no
    # system-site leak, so the mock target must be a real dev dep
    "huggingface_hub>=0.30",
]

[project.scripts]
abliterate = "abliteration_engine.cli:main"

[build-system]
requires = ["uv_build>=0.7,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "abliteration_engine"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"